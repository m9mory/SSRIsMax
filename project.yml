name: MaxClient
options:
  bundleIdPrefix: ru.maxclient
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  MaxClient:
    type: application
    platform: iOS

    # Info.plist лежит в репозитории (пригодится и при ручной настройке
    # проекта), поэтому исключён из ресурсов: копия внутри бандла ломает
    # подпись ("Info.plist in both ...").
    sources:
      - path: MaxClient
        excludes:
          - "Resources/Info.plist"
      - path: MaxClient/Resources
        buildPhase: resources
        excludes:
          - "Info.plist"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.maxclient.app
        PRODUCT_NAME: MAX
        INFOPLIST_FILE: MaxClient/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES

    dependencies:
      - package: GRDB

  MaxCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MaxClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.maxclient.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MaxClient:
    build:
      targets:
        MaxClient: all
        MaxCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MaxCoreTests
