name: CI

# Сборка и тесты клиента на macOS-раннере GitHub Actions.
# Каждый успешный прогон main публикует не подписанный .ipa в Releases.
# Подпись — только в вашем Xcode или инструментом сайдлоада:
# сертификат и профиль в CI не нужны.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# По умолчанию у GITHUB_TOKEN только чтение; для gh release нужна запись.
permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: MaxClient
  XCODEPROJ: MaxClient.xcodeproj

jobs:
  # ---------------------------------------------------------------------------
  # Шаг 1. Ядро через SwiftPM: быстро, без подписи и без симулятора.
  # Ловит ошибки протокола, кодека MessagePack и парсеров.
  # ---------------------------------------------------------------------------
  core:
    name: Core (SwiftPM)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Версия Swift
        run: swift --version

      - name: Кеш SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            Tools/max-core/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Tools/max-core/**') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Ядро компилируется
        working-directory: Tools/max-core
        run: swift build

      - name: Офлайн-тесты протокола
        working-directory: Tools/max-core
        run: swift test

  # ---------------------------------------------------------------------------
  # Шаг 2. Настоящий iOS-проект: XcodeGen → сборка → тесты на симуляторе.
  # Симулятор выбирается динамически: имена и версии на раннере меняются
  # (iPhone 16 / iPhone 17, iOS 18 / iOS 26), жёстко задавать нельзя.
  # ---------------------------------------------------------------------------
  ios:
    name: iOS build & tests
    runs-on: macos-15
    needs: core
    steps:
      - uses: actions/checkout@v4

      - name: Зеркало ядра не отстало
        run: |
          chmod +x scripts/sync-core.sh scripts/make-ipa.sh
          scripts/sync-core.sh --verify

      - name: Установка XcodeGen
        run: brew install xcodegen

      - name: Генерация проекта
        run: xcodegen generate

      - name: Выбор симулятора
        run: |
          set -euo pipefail
          echo "Xcode: $(xcodebuild -version | head -1)"
          # Имена и версии симуляторов на раннере меняются (iPhone 16/17,
          # iOS 18/26), поэтому берём первый доступный iPhone старшей ОС.
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          UDID=$(grep -o '"udid" : "[0-9A-F-]*"' "$RUNNER_TEMP/devices.json" \
                 | head -1 | sed -E 's/.*"udid" : "([0-9A-F-]+)".*/\1/')
          if [ -z "$UDID" ]; then
            echo "Не нашли ни одного симулятора" >&2
            exit 1
          fi
          echo "SIM_ID=$UDID" >> "$GITHUB_ENV"
          echo "Симулятор: $UDID"

      - name: Кеш Swift-пакетов Xcode
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-spm-${{ hashFiles('project.yml') }}
          restore-keys: xcode-spm-

      - name: Сборка для симулятора
        run: |
          set -o pipefail
          xcodebuild -project "$XCODEPROJ" -scheme "$SCHEME" \
            -configuration Debug -destination "id=$SIM_ID" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Тесты
        run: |
          set -o pipefail
          xcodebuild -project "$XCODEPROJ" -scheme "$SCHEME" \
            -destination "id=$SIM_ID" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO test

      # Симуляторный .app не годится для сайдлоада: другая платформа и
      # архитектура. Для .ipa нужна сборка под устройство (iphoneos) без
      # подписи — подписывает уже SideStore/AltStore/Sideloadly.
      - name: Сборка под устройство (для .ipa)
        run: |
          set -o pipefail
          xcodebuild -project "$XCODEPROJ" -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" EXPANDED_CODE_SIGN_IDENTITY="" \
            build

      - name: Сборка не подписанного .ipa
        run: |
          set -euo pipefail
          APP=$(find build-device/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          echo "Приложение: $APP"
          # Убеждаемся, что это сборка под устройство, а не под симулятор:
          # иначе в релиз уедет нерабочий пакет.
          BIN="$APP/$(basename "$APP" .app)"
          if ! lipo -info "$BIN" | grep -Eq 'arm64'; then
            echo "Неожиданная архитектура бинарника: $(lipo -info "$BIN")" >&2
            exit 1
          fi
          if lipo -info "$BIN" | grep -Eq 'x86_64'; then
            echo "Это симбинарник для симулятора, а не для устройства" >&2
            exit 1
          fi
          mkdir -p artifacts
          # В релиз уходит только .ipa: .app разворачивается из исходников.
          scripts/make-ipa.sh "$APP" artifacts/SSRIsMax-unsigned.ipa
          ls -lh artifacts

      # Тег вида v0.1.0-<short sha> на каждый успешный прогон main.
      # Релиз создаётся/обновляется по этому тегу.
      - name: Публикация релиза
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -o 'MARKETING_VERSION: "[^"]*"' project.yml | head -1 | sed -E 's/.*"([^"]*)".*/\1/')
          VERSION=${VERSION:-0.0.0}
          SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          TAG="v${VERSION}-${SHORT}"
          echo "Тег релиза: $TAG"

          # Заметки к релизу собираются printf, а не heredoc: пустые строки
          # внутри YAML-блока «run: |» обнуляют отступ и ломают разбор.
          NOTES=$(printf '%s\n' \
            'Не подписанный .ipa неофициального клиента MAX.' \
            '' \
            'Установка: Sideloadly / SideStore / AltStore (подпись вашим Apple ID) или TrollStore на iOS 14.0–17.0.' \
            '' \
            "- Версия: ${VERSION}" \
            "- Коммит: ${GITHUB_SHA}" \
            '- Собран в GitHub Actions из исходников этого репозитория.')

          # Повторный прогон того же коммита — просто перезаписываем файл.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/SSRIsMax-unsigned.ipa \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" artifacts/SSRIsMax-unsigned.ipa \
              --repo "$GITHUB_REPOSITORY" \
              --title "SSRIsMax ${VERSION} (${SHORT})" \
              --notes "$NOTES"
          fi
